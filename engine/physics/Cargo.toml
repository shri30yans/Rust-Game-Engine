[package]
name = "engine-physics"
description = "Deterministic Rapier physics wrapper and shared kinematic character controller"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["cross-platform-determinism"]
cross-platform-determinism = ["rapier3d/enhanced-determinism"]
simd = ["rapier3d/simd8"]

[dependencies]
engine-core.workspace = true
engine-assets.workspace = true
engine-world.workspace = true
glam.workspace = true
rapier3d.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
stats_alloc.workspace = true

[lints]
workspace = true

[[bench]]
name = "determinism"
harness = false

[[bench]]
name = "physics"
harness = false
