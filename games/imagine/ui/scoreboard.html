<!doctype html><html><head><style>
body { background-color: #07090cbf; display: flex; align-items: center; justify-content: center; }
.card { width: 70%; padding: 16px; background-color: #141922; display: flex; flex-direction: column; gap: 6px; }
.title { font-size: 32px; color: #f3f5f8; }
.row { height: 38px; padding: 6px; background-color: #1e2530; display: flex; align-items: flex-start; justify-content: space-between; }
.name { font-size: 16px; color: #c3cad4; }
.stats { width: 320px; font-size: 16px; color: #c3cad4; text-align: right; }
button { width: 100%; height: 48px; background-color: #141922; border: 1px solid #46505f; color: #f3f5f8; }
button:focus-visible { border: 3px solid #ff6a1a; }
</style></head><body data-default-focus="close">
<div class="card"><p class="title">SCOREBOARD · PRACTICE</p><template data-repeat="scores" data-max="12"><div class="row"><p class="name">{item.name} · TEAM {item.team}</p><p class="stats">{item.kills} ELIMS · {item.deaths} DEATHS</p></div></template><button id="close" data-action="close">CLOSE</button></div>
</body></html>
