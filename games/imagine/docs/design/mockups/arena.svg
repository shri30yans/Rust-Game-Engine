<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Placeholder "scene" for HUD mockups: brutalist concrete arena at dusk, warm practicals, one cool LED panel, dust. Not a render. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a52"/><stop offset=".55" stop-color="#8a8f9c"/><stop offset="1" stop-color="#d9b48a"/>
    </linearGradient>
    <linearGradient id="conc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d7a74"/><stop offset="1" stop-color="#4e4c49"/>
    </linearGradient>
    <linearGradient id="concDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b3a38"/><stop offset="1" stop-color="#5a5752"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a655d"/><stop offset="1" stop-color="#2e2c29"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dust" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e8dccb" stop-opacity=".55"/><stop offset="1" stop-color="#e8dccb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b9a2" stop-opacity="0"/><stop offset=".6" stop-color="#c9b9a2" stop-opacity=".35"/><stop offset="1" stop-color="#c9b9a2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <!-- far skyline -->
  <g fill="#6f7480" opacity=".8">
    <rect x="0" y="250" width="120" height="200"/><rect x="130" y="210" width="80" height="240"/><rect x="900" y="230" width="140" height="220"/>
    <rect x="1050" y="190" width="90" height="260"/><rect x="1150" y="260" width="130" height="190"/>
  </g>
  <!-- main building left: concrete with window grid -->
  <polygon points="0,140 420,190 420,560 0,600" fill="url(#conc)"/>
  <g fill="#2b2a28">
    <rect x="40" y="220" width="60" height="70"/><rect x="140" y="230" width="60" height="70"/><rect x="240" y="240" width="60" height="70"/><rect x="330" y="248" width="55" height="68"/>
    <rect x="40" y="350" width="60" height="70"/><rect x="140" y="355" width="60" height="70"/><rect x="330" y="360" width="55" height="68"/>
  </g>
  <rect x="240" y="358" width="60" height="70" fill="#ffcc88"/>
  <circle cx="270" cy="393" r="90" fill="url(#warm)"/>
  <!-- broken corner: destruction -->
  <polygon points="300,190 420,190 420,330 380,300 350,260 320,240" fill="url(#sky)"/>
  <g fill="#5d5a55"><polygon points="352,262 372,280 360,292"/><polygon points="385,302 405,318 392,326"/></g>
  <g stroke="#3a2f28" stroke-width="2"><line x1="350" y1="262" x2="336" y2="236"/><line x1="380" y1="300" x2="394" y2="272"/></g>
  <!-- right building with LED panel -->
  <polygon points="820,170 1280,120 1280,600 820,560" fill="url(#concDark)"/>
  <rect x="900" y="230" width="230" height="110" fill="#0d2230"/>
  <rect x="906" y="236" width="218" height="98" fill="#7FE3FF" opacity=".85"/>
  <rect x="906" y="236" width="218" height="98" fill="url(#warm)" opacity=".1"/>
  <g fill="#0c2a36"><rect x="930" y="262" width="120" height="14"/><rect x="930" y="288" width="170" height="14"/><rect x="930" y="306" width="80" height="8" opacity=".6"/></g>
  <ellipse cx="1015" cy="285" rx="150" ry="80" fill="#7FE3FF" opacity=".08"/>
  <!-- mid ground cover blocks -->
  <polygon points="430,450 640,440 650,560 425,570" fill="#5f5b55"/>
  <polygon points="430,450 640,440 640,452 430,462" fill="#8b867d"/>
  <polygon points="700,470 840,462 846,560 698,566" fill="#57534d"/>
  <!-- distant enemy silhouette (team tide shoulder) -->
  <g transform="translate(742,400)">
    <rect x="-9" y="0" width="18" height="44" rx="6" fill="#22252b"/><circle cx="0" cy="-8" r="9" fill="#22252b"/>
    <rect x="-11" y="4" width="6" height="8" fill="#3D8CFF"/><rect x="5" y="4" width="6" height="8" fill="#3D8CFF"/>
  </g>
  <!-- floor -->
  <polygon points="0,560 1280,540 1280,720 0,720" fill="url(#floor)"/>
  <g stroke="#7d776d" stroke-width="2" opacity=".35"><line x1="0" y1="620" x2="1280" y2="600"/><line x1="640" y1="550" x2="300" y2="720"/><line x1="640" y1="550" x2="980" y2="720"/></g>
  <!-- rubble -->
  <g fill="#6c675f"><polygon points="360,600 400,590 410,615 370,622"/><polygon points="420,620 445,612 452,630"/><polygon points="330,630 352,624 356,640 334,642"/></g>
  <!-- dust and haze -->
  <rect width="1280" height="720" fill="url(#haze)"/>
  <ellipse cx="370" cy="300" rx="200" ry="140" fill="url(#dust)"/>
  <ellipse cx="420" cy="590" rx="260" ry="70" fill="url(#dust)"/>
  <!-- viewmodel (abstract weapon, bottom right) -->
  <g transform="translate(860,520)">
    <polygon points="120,200 300,60 420,80 420,200" fill="#1b1d21"/>
    <polygon points="160,170 300,70 330,74 200,190" fill="#34373d"/>
    <polygon points="300,60 380,40 420,48 420,80" fill="#2a2d33"/>
    <rect x="248" y="96" width="40" height="10" fill="#FF6A1A" transform="rotate(-35 268 101)"/>
  </g>
</svg>
