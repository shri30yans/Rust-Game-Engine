<!doctype html><html><head><meta charset="utf-8"><title>Results mockup — Control Room</title>
<link rel="stylesheet" href="tokens.css">
<style>
body{background:linear-gradient(180deg,#0f131a,#0a0c10)}
.wipe{left:-80px;top:70px;width:1500px;height:270px;background:var(--signal);transform:rotate(-4deg);transform-origin:0 0}
.wipe::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 26px,rgba(12,15,20,.08) 26px 40px)}
.place{left:60px;top:78px;color:var(--ink-900)}
.place .big{font-size:200px;line-height:.8}
.place .sub{font:700 24px/1 "Barlow Condensed";letter-spacing:.18em;text-transform:uppercase;margin-top:8px}
.ht{right:0;top:60px;width:560px;height:240px;opacity:.5;background-image:radial-gradient(rgba(12,15,20,.6) 1.6px,transparent 1.8px);background-size:10px 10px;-webkit-mask:linear-gradient(90deg,transparent,#000);mask:linear-gradient(90deg,transparent,#000);transform:rotate(-4deg)}
.total{right:64px;top:110px;text-align:right;color:var(--ink-900)}
.total .n{font-size:110px;line-height:.85}
.board{left:60px;top:370px;width:700px}
.tr{display:grid;grid-template-columns:56px 1fr 120px 120px;align-items:center;height:62px;margin-bottom:8px;background:var(--ink-800);position:relative}
.tr .p{font:900 34px/1 "Big Shoulders Display";text-align:center}
.tr .nm{display:flex;align-items:center;gap:12px;font:700 24px/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase}
.tr .c{font:700 28px/1 "Barlow Condensed";color:var(--score);text-align:right;padding-right:16px;font-variant-numeric:tabular-nums}
.tr .k{font:600 16px/1 "Barlow Condensed";letter-spacing:.1em;color:var(--ink-300);text-align:right}
.tr.you{background:var(--ink-700);box-shadow:inset 6px 0 0 var(--ember)}
.me{left:800px;top:370px;width:448px}
.mvp{height:140px;background:var(--ink-800);position:relative;padding:16px 18px;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%);overflow:hidden}
.mvp img{position:absolute;right:-10px;top:-6px;width:150px;height:240px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.sg>div{background:var(--ink-800);padding:10px 12px;height:68px}
.sg .n{font:700 30px/1 "Barlow Condensed";font-variant-numeric:tabular-nums}
.sg .l{font:600 12px/1 "Barlow Condensed";letter-spacing:.14em;color:var(--ink-300);text-transform:uppercase;margin-top:4px}
.xp{position:absolute;left:60px;top:632px;width:620px;background:var(--ink-800);padding:12px 14px}
.xpb{height:10px;background:var(--ink-600);margin-top:8px;position:relative}.xpb i{position:absolute;left:0;top:0;bottom:0;width:58%;background:var(--paper)}.xpb b{position:absolute;left:58%;top:0;bottom:0;width:14%;background:var(--signal)}
.cont{right:32px;bottom:28px;height:60px;width:260px;background:var(--signal);color:var(--ink-900);display:flex;align-items:center;justify-content:center;font:900 34px/1 "Big Shoulders Display";letter-spacing:.04em;text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.sec2{right:310px;bottom:28px;height:60px;padding:0 22px;border:1px solid var(--ink-500);display:flex;align-items:center;font:700 18px/1 "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--ink-200)}
</style></head><body class="grid">
<div class="abs wipe"></div>
<div class="abs ht"></div>
<div class="abs place disp"><div class="big">1st place</div><div class="sub" style="font-family:'Barlow Condensed'">▲ Team Ember wins · Team Fight · Kiln Yard</div></div>
<div class="abs total"><div class="tc" style="color:rgba(12,15,20,.7);margin-bottom:6px">ELIMINATIONS · GRID E5</div><div class="n disp">50</div></div>

<div class="abs board">
  <div class="eyebrow" style="display:flex;gap:10px;align-items:center;font:700 15px/1 'Barlow Condensed';letter-spacing:.18em;color:var(--ink-300);margin-bottom:12px"><span style="width:28px;height:2px;background:var(--signal)"></span>FINAL STANDINGS</div>
  <div class="tr you"><span class="p" style="color:var(--ember)">1</span><span class="nm"><span style="color:var(--ember)">▲</span>Ember <span style="font-size:15px;background:var(--signal);color:var(--ink-900);padding:3px 6px">YOU</span></span><span class="k">14 elims</span><span class="c">50</span></div>
  <div class="tr"><span class="p" style="color:var(--tide)">2</span><span class="nm"><span style="color:var(--tide)">●</span>Tide</span><span class="k">11 elims</span><span class="c">41</span></div>
  <div class="tr"><span class="p" style="color:var(--volt)">3</span><span class="nm"><span style="color:var(--volt)">■</span>Volt</span><span class="k">6 elims</span><span class="c">22</span></div>
</div>

<div class="abs me">
  <div class="mvp"><img src="player.svg"><div style="font:700 14px/1 'Barlow Condensed';letter-spacing:.18em;color:var(--score)">★ MATCH MVP</div><div class="disp" style="font-size:52px;margin-top:6px">Kestrel</div><div style="font:600 16px/1.3 'Barlow Condensed';letter-spacing:.1em;color:var(--ink-200);text-transform:uppercase;margin-top:6px">Most eliminations · 14</div></div>
  <div class="sg"><div><div class="n">14</div><div class="l">Elims</div></div><div><div class="n">6</div><div class="l">Revives</div></div><div><div class="n">3.2k</div><div class="l">Damage</div></div><div><div class="n" style="color:var(--score)">+820</div><div class="l">Score</div></div></div>
</div>

<div class="xp"><div style="display:flex;justify-content:space-between;font:700 18px/1 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase"><span>Level 24</span><span style="color:var(--signal)">+1,940 XP</span></div><div class="xpb"><i></i><b></b></div></div>
<div class="abs sec2">Watch replay</div>
<div class="abs cont">Continue</div>
<div class="crop" style="left:24px;bottom:24px"></div>
</body></html>
