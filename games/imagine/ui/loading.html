<!doctype html><html><head><style>
body { background-color: #0c0f14; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.title { font-size: 40px; color: #f3f5f8; }
.mode { font-size: 22px; color: #7fe3ff; }
.rule { font-size: 14px; color: #c3cad4; }
.title, .mode, .rule, .tip { width: 100%; text-align: center; }
.track { width: 60%; height: 8px; background-color: #2c3543; }
progress { width: 60%; height: 8px; color: #ff6a1a; }
.tip { font-size: 14px; color: #98a2b1; }
</style></head><body>
<p class="title">{arena}</p><p class="mode">{mode}</p><p class="rule">PRACTICE · LEARN THE KILN YARD ROUTES.</p><progress data-bind="load_progress" style="color:#ff6a1a"></progress><p class="tip">TIP · {tip}</p>
</body></html>
