<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <!-- Original placeholder character: "player 07", Medium class. Padded jacket, visor helmet, ember team panels. Stand-in for a lit 3D model. -->
  <defs>
    <linearGradient id="jk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b313b"/><stop offset=".55" stop-color="#3c4452"/><stop offset="1" stop-color="#1b1f26"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6A1A" stop-opacity="0"/><stop offset=".85" stop-color="#FF6A1A" stop-opacity="0"/><stop offset="1" stop-color="#FF8A4A" stop-opacity=".9"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FE3FF"/><stop offset=".5" stop-color="#1d5d73"/><stop offset="1" stop-color="#0b1c24"/></linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232830"/><stop offset="1" stop-color="#14171c"/></linearGradient>
  </defs>
  <!-- legs -->
  <path d="M140 400 L128 600 L176 604 L196 430 L214 430 L232 604 L280 600 L262 400 Z" fill="url(#pants)"/>
  <rect x="122" y="590" width="62" height="34" rx="6" fill="#0f1115"/><rect x="226" y="590" width="62" height="34" rx="6" fill="#0f1115"/>
  <rect x="134" y="470" width="44" height="40" rx="4" fill="#2c323c"/><!-- knee pad -->
  <rect x="228" y="470" width="44" height="40" rx="4" fill="#2c323c"/>
  <!-- torso jacket -->
  <path d="M110 190 Q200 160 290 190 L306 300 L292 410 L108 410 L94 300 Z" fill="url(#jk)"/>
  <path d="M110 190 Q200 160 290 190 L306 300 L292 410 L108 410 L94 300 Z" fill="url(#rim)"/>
  <!-- quilting lines -->
  <g stroke="#1a1e25" stroke-width="3" opacity=".7"><path d="M104 250 H296"/><path d="M100 300 H300"/><path d="M104 350 H296"/></g>
  <!-- vest / chest rig -->
  <path d="M150 210 L250 210 L262 330 L138 330 Z" fill="#171a20"/>
  <rect x="156" y="270" width="26" height="40" rx="3" fill="#2a2f38"/><rect x="187" y="270" width="26" height="40" rx="3" fill="#2a2f38"/><rect x="218" y="270" width="26" height="40" rx="3" fill="#2a2f38"/>
  <!-- player number plate -->
  <rect x="166" y="220" width="68" height="40" fill="#F3F5F8"/>
  <text x="200" y="252" text-anchor="middle" font-family="Big Shoulders Display, Anton, sans-serif" font-weight="900" font-size="36" fill="#0C0F14">07</text>
  <!-- team shoulder panels (ember) -->
  <path d="M96 190 Q110 176 140 178 L136 236 L88 246 Z" fill="#FF7A3D"/>
  <path d="M304 190 Q290 176 260 178 L264 236 L312 246 Z" fill="#FF7A3D"/>
  <!-- arms -->
  <path d="M88 246 L136 236 L132 330 L120 400 L84 396 L76 320 Z" fill="#2f3540"/>
  <path d="M312 246 L264 236 L268 330 L280 400 L316 396 L324 320 Z" fill="#262b34"/>
  <rect x="78" y="392" width="44" height="40" rx="10" fill="#14171c"/><rect x="278" y="392" width="44" height="40" rx="10" fill="#14171c"/>
  <!-- backpack panel edge visible -->
  <rect x="290" y="200" width="18" height="120" fill="#FF7A3D" opacity=".85"/>
  <!-- neck + collar -->
  <path d="M168 168 L232 168 L240 200 L160 200 Z" fill="#1a1e25"/>
  <!-- helmet -->
  <path d="M136 92 Q140 22 200 18 Q262 22 266 92 L262 160 Q200 182 140 160 Z" fill="#E9ECF0"/>
  <path d="M136 92 Q140 22 200 18 Q262 22 266 92 L262 160 Q200 182 140 160 Z" fill="url(#rim)"/>
  <path d="M150 74 L252 74 L258 124 Q200 144 144 124 Z" fill="url(#visor)"/>
  <path d="M160 82 L214 82 L176 120 L150 118 Z" fill="#ffffff" opacity=".18"/>
  <rect x="190" y="22" width="20" height="40" fill="#FF6A1A"/><!-- helmet stripe -->
  <rect x="262" y="100" width="12" height="30" rx="3" fill="#2c323c"/><!-- earpiece -->
  <circle cx="268" cy="96" r="4" fill="#FF6A1A"/><!-- tally on helmet cam -->
</svg>
