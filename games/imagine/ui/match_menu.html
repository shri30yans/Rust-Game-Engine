<!doctype html><html><head><style>
body { background-color: #07090cbf; display: flex; align-items: center; justify-content: center; }
.card { width: 58%; padding: 20px; background-color: #141922; display: flex; flex-direction: column; gap: 8px; border: 4px solid #ff6a1a; }
.title { font-size: 32px; color: #f3f5f8; }
button { width: 100%; height: 48px; background-color: #1e2530; border: 1px solid #46505f; color: #f3f5f8; }
button:focus-visible { border: 3px solid #ff6a1a; }
button:active { transform: scale(0.97); }
</style></head><body data-default-focus="resume">
<div class="card"><p class="title">MATCH MENU</p><button id="resume" data-action="resume">RESUME</button><button id="settings" data-action="settings">SETTINGS</button><button id="scoreboard" data-action="scoreboard">SCOREBOARD</button><button id="leave" data-action="leave">LEAVE MATCH</button></div>
</body></html>
