<!doctype html><html><head><style>
body { background-color: #0c0f14; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; height: 52px; border: 1px solid #2c3543; }
.logo { width: 300px; font-size: 34px; color: #f3f5f8; }
.profile { width: 200px; font-size: 14px; color: #c3cad4; }
.main { display: flex; gap: 20px; }
.left { width: 42%; background-color: #141922; padding: 24px; display: flex; flex-direction: column; }
.right { flex-grow: 1; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 12px; color: #98a2b1; }
.title { font-size: 40px; color: #f3f5f8; }
.desc { font-size: 14px; color: #c3cad4; }
button { height: 52px; width: 100%; background-color: #141922; border: 1px solid #46505f; color: #f3f5f8; }
button:focus-visible { border: 3px solid #ff6a1a; }
button:active { opacity: 0.8; transform: scale(0.97); }
.play { background-color: #ff6a1a; color: #0c0f14; }
.play:focus-visible { border: 3px solid #f3f5f8; }
#settings_top { width: 140px; }
.strip { font-size: 12px; color: #98a2b1; }
</style></head><body data-default-focus="play">
<div class="top"><p class="logo">IMAGINE</p><p class="profile">{player} · LEVEL 01</p><button id="settings_top" data-action="settings_top">SETTINGS</button></div>
<div class="main"><div class="left"><p class="eyebrow">FEATURED · SEASON 1</p><p class="title">PRACTICE</p><p class="desc">Enter Kiln Yard and learn the arena with bots.</p></div>
<div class="right"><button id="play" class="play" data-action="play">PLAY</button><button id="loadout" data-action="loadout">LOADOUT</button><button id="settings" data-action="settings">SETTINGS</button><p class="strip">GRID B2 · LOCAL SESSION · KILN YARD</p></div></div>
</body></html>
