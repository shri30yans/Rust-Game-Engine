[workspace]
resolver = "3"
members = [
    "engine/app",
    "tools/ui-cook",
    "tools/cook",
    "tools/texture-encode",
    "engine/core",
    "engine/assets",
    "engine/jobs",
    "engine/netcode",
    "engine/world",
    "engine/destruction",
    "engine/physics",
    "engine/platform",
    "engine/render",
    "engine/audio",
    "engine/scene",
    "engine/sessions",
    "engine/ui",
    "games/sandbox/game",
    "kits/fps",
    "tools/check-layers",
    "tools/bench-gate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
hecs = "0.11.2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2"
rayon = "1.12.0"
tracing = "0.1"
tracing-subscriber = "0.3"
proptest = "1"
stats_alloc = "0.1"
criterion = "0.5"
serde_json = "1"
bytemuck = { version = "1.25.2", features = ["derive"] }
half = "2.7.1"
fontdue = "0.9.5"
glam = "0.30"
ron = "0.10"
png = "0.18.1"
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "block_layout", "content_size"] }
html5ever = "0.40.1"
markup5ever_rcdom = "0.40.1"
cssparser = "0.38.0"
pollster = "1.0.1"
rapier3d = { version = "0.36", features = ["serde-serialize"] }
wgpu = "30.0.1"
kira = { version = "0.12.6", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm"] }
winit = "0.30.13"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
engine-core = { path = "engine/core" }
engine-assets = { path = "engine/assets" }
engine-netcode = { path = "engine/netcode" }
engine-world = { path = "engine/world" }
engine-destruction = { path = "engine/destruction" }
engine-physics = { path = "engine/physics" }
engine-scene = { path = "engine/scene" }
engine-sessions = { path = "engine/sessions" }
platform = { package = "engine-platform", path = "engine/platform" }
render = { package = "engine-render", path = "engine/render" }
engine-ui = { path = "engine/ui" }
engine-audio = { path = "engine/audio" }
ui-cook = { path = "tools/ui-cook" }
app = { package = "engine-app", path = "engine/app" }
jobs = { package = "engine-jobs", path = "engine/jobs" }
kit-fps = { path = "kits/fps" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
incremental = true
# Line tables keep file:line in backtraces and profilers; full variable info made the target
# folder and link times several times larger.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Dependencies are not debugged here; their debug info was most of the target size.
debug = false

[profile.play]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
debug-assertions = true
overflow-checks = false
