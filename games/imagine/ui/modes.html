<!doctype html><html><head><style>
body { background-color: #0c0f14; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.title { font-size: 40px; color: #f3f5f8; }
.hint { font-size: 14px; color: #98a2b1; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { padding: 12px; background-color: #141922; border: 1px solid #2c3543; display: flex; flex-direction: column; gap: 4px; }
.name { font-size: 22px; color: #f3f5f8; }
.meta { font-size: 12px; color: #7fe3ff; }
.rule { font-size: 14px; color: #c3cad4; }
button { width: 100%; height: 48px; background-color: #141922; border: 1px solid #46505f; color: #f3f5f8; }
button:focus-visible { border: 3px solid #ff6a1a; }
button:disabled { opacity: 0.45; }
button:active { transform: scale(0.97); }
</style></head><body data-default-focus="mode_select">
<p class="title">SELECT MODE</p><p class="hint">SEASON 1 · THE TRIALS</p>
<div class="rows"><template data-repeat="modes" data-max="3"><div class="row"><p class="name">{item.name}</p><p class="meta">{item.players} · {item.length}</p><p class="rule">{item.rule}</p><button id="mode_select" data-action="mode_select" data-disabled="item.disabled">{item.action}</button></div></template></div>
</body></html>
